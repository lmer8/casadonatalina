<article class="journal-entry SCEGLI-QUI-LA-CLASSE-COLORE">

    <!-- IMMAGINE: aggiornare percorso e descrizione -->
    <div class="journal-image">
        <img src="images/NOME-IMMAGINE.jpg"
             alt="DESCRIZIONE DELL'IMMAGINE">
    </div>

    <div class="journal-text">

        <!-- NUMERO: aggiornare il numero progressivo -->
        <p class="journal-number">Taccuino #NUMERO</p>

        <!-- TITOLO -->
        <h2>TITOLO DEL TACCUINO</h2>

        <!-- DATA -->
        <p class="journal-date">GIORNO MESE ANNO</p>

        <!--
        INTRODUZIONE FACOLTATIVA:
        Se vuoi evidenziare l'introduzione in corsivo,
        usa questo blocco. Altrimenti puoi eliminarlo.
        -->
        <div class="journal-intro">
            <p><em>
                TESTO INTRODUTTIVO.
            </em></p>
        </div>

        <!-- TESTO: inserire uno o più paragrafi -->
        <p>
            PRIMO PARAGRAFO.
        </p>

        <p>
            SECONDO PARAGRAFO.
        </p>

        <!--
        AGGIUNGERE QUI ALTRI PARAGRAFI.
        Puoi usare normalmente:
        <strong>grassetto</strong>
        <em>corsivo</em>
        <a href="URL">link</a>
        <br> per andare a capo.
        -->

        <!-- SEPARATORE FINALE -->
        <hr>

        <!-- FRASE CONCLUSIVA -->
        <p class="journal-ending">
            <strong>Le storie continuano a vivere quando vengono condivise.</strong>
        </p>

        <!-- INVITO A COMMENTARE -->
        <p>
            Se questa riflessione vi è sembrata interessante e volete commentarla,
            scrivetemi!
            <a href="mailto:info@casadonatalina.it">info@casadonatalina.it</a>
        </p>

    </div>

</article>
